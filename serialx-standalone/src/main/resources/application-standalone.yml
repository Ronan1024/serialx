server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: serialx
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SERIALX_MYSQL_URL}
    username: ${SERIALX_MYSQL_USERNAME}
    password: ${SERIALX_MYSQL_PASSWORD}
  data:
    redis:
      host: ${SERIALX_REDIS_HOST:localhost}
      port: ${SERIALX_REDIS_PORT:6379}
      password: ${SERIALX_REDIS_PASSWORD:}
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

serialx:
  outbound:
    http:
      connect-timeout: ${SERIALX_HTTP_CONNECT_TIMEOUT:${SERIALX_NODE_CONNECT_TIMEOUT:1s}}
      request-timeout: ${SERIALX_HTTP_REQUEST_TIMEOUT:${SERIALX_NODE_REQUEST_TIMEOUT:2s}}
  admin:
    node-allocation:
      machine-token: ${SERIALX_SERVICE_NODE_TOKEN:}
      legacy-http-enabled: ${SERIALX_LEGACY_NODE_HTTP_ENABLED:true}
      legacy-http-until: ${SERIALX_LEGACY_NODE_HTTP_UNTIL:2027-01-01T00:00:00Z}
      reserved-window: ${SERIALX_NODE_RESERVED_WINDOW:60s}
    security:
      jwt-secret: ${SERIALX_ADMIN_JWT_SECRET}
      jwt-issuer: ${SERIALX_ADMIN_JWT_ISSUER:serialx}
      access-token-ttl: ${SERIALX_ADMIN_ACCESS_TOKEN_TTL:2h}
      bootstrap-username: ${SERIALX_ADMIN_BOOTSTRAP_USERNAME:admin}
      bootstrap-password: ${SERIALX_ADMIN_BOOTSTRAP_PASSWORD:123456}
    instance-status:
      alive-timeout: ${SERIALX_INSTANCE_STATUS_ALIVE_TIMEOUT:90s}
  service:
    auth:
      signature:
        enabled: ${SERIALX_APP_AUTH_ENABLED:false}
        signature-expire-window: ${SERIALX_APP_SIGNATURE_EXPIRE_WINDOW:5m}
    call-stats:
      enabled: ${SERIALX_CALL_STATS_ENABLED:true}
      flush-interval: ${SERIALX_CALL_STATS_FLUSH_INTERVAL:10s}
      max-qps: ${SERIALX_SERVICE_MAX_QPS:0}
    snowflake:
      # 节点身份及固定 5/5/12 布局由租约返回，不接受人工节点编号。
      admin-url: ${SERIALX_ADMIN_URL:http://localhost:8080}
      machine-token: ${SERIALX_SERVICE_NODE_TOKEN}
      startup-attempts: ${SERIALX_NODE_STARTUP_ATTEMPTS:3}
    instance:
      channel: ${SERIALX_NAMESPACE_CHANGE_CHANNEL:serialx:namespace:change}
      full-sync-interval: ${SERIALX_NAMESPACE_FULL_SYNC_INTERVAL:30s}
      status-ttl: ${SERIALX_NAMESPACE_STATUS_TTL:24h}
      instance-id: ${SERIALX_SERVICE_INSTANCE_ID:}
      advertised-ip: ${SERIALX_SERVICE_INSTANCE_IP:}
      enabled: ${SERIALX_SERVICE_INSTANCE_ENABLED:true}
      namespace-refresh-enabled: ${SERIALX_NAMESPACE_REFRESH_ENABLED:true}
